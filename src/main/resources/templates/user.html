<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Личный кабинет</title></head>
<body><h1>Личный кабинет</h1>
<p>Имя: <span th:text="${user.name}"></span></p>
<p>Фамилия: <span th:text="${user.lastName}"></span></p>
<p>Email: <span th:text="${user.email}"></span></p>
<p>Роли: <span th:each="role : ${user.roles}" th:text="${role.name} + ' '"></span></p>
<form th:action="@{/logout}" method="post"><button type="submit">Выйти</button></form>
</body></html>
