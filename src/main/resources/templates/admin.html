<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Админ-панель</title></head>
<body>
<h1>Управление пользователями</h1>
<p><a th:href="@{/admin/new}">Создать пользователя</a> | <a th:href="@{/user}">Мой профиль</a></p>
<table border="1"><thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Email</th><th>Роли</th><th>Действия</th></tr></thead>
<tbody><tr th:each="u : ${users}">
<td th:text="${u.id}"></td><td th:text="${u.name}"></td>
<td th:text="${u.lastName}"></td><td th:text="${u.email}"></td>
<td><span th:each="r : ${u.roles}" th:text="${r.name} + ' '"></span></td>
<td><a th:href="@{/admin/{id}/edit(id=${u.id})}">Изменить</a>
<form th:action="@{/admin/{id}/delete(id=${u.id})}" method="post" style="display:inline">
<button type="submit" onclick="return confirm('Удалить пользователя?')">Удалить</button>
</form></td></tr></tbody></table>
<form th:action="@{/logout}" method="post"><button type="submit">Выйти</button></form>
</body></html>
